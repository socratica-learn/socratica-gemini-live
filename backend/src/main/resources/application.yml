spring:
  application:
    name: socratica

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:}
      database: ${MONGODB_DATABASE:socratica_dev}
      auto-index-creation: true

  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:changeme}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring.servlet.multipart:
  max-file-size: 20MB
  max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Application-specific configuration
socratica:
  jwt:
    secret: ${JWT_SECRET:your-very-secret-jwt-key-change-this-in-production}
    expiration: ${JWT_EXPIRATION:3600000} # 1 hour in milliseconds
  gemini:
    api-key: ${GOOGLE_API_KEY:}
    project-id: ${GOOGLE_CLOUD_PROJECT:}
    location: ${GOOGLE_CLOUD_REGION:europe-west4}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    live-model: ${GEMINI_LIVE_MODEL:gemini-live-2.5-flash-native-audio}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/oauth/google/callback}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:noreply@socratica.com}

logging:
  level:
    root: INFO
    com.socratica: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.mongodb: DEBUG
