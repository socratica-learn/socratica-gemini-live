steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - backend/Dockerfile
      - -t
      - ${_IMAGE}
      - backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_IMAGE}
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - "8080"
      - --set-env-vars
      - SPRING_DATA_MONGODB_URI=${_SPRING_DATA_MONGODB_URI},MONGODB_DATABASE=${_MONGODB_DATABASE},GEMINI_API_KEY=${_GEMINI_API_KEY},GEMINI_LIVE_MODEL=${_GEMINI_LIVE_MODEL},JWT_SECRET=${_JWT_SECRET},FRONTEND_URL=${_FRONTEND_URL},CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS}

substitutions:
  _SERVICE: socratica-backend
  _REGION: europe-west4
  _IMAGE: europe-west4-docker.pkg.dev/$PROJECT_ID/socratica/socratica-backend:latest
  _SPRING_DATA_MONGODB_URI: ""
  _MONGODB_DATABASE: socratica_dev
  _GEMINI_API_KEY: ""
  _GEMINI_LIVE_MODEL: gemini-live-2.5-flash-preview
  _JWT_SECRET: change-me
  _FRONTEND_URL: http://localhost:5173
  _CORS_ALLOWED_ORIGINS: http://localhost:5173

images:
  - ${_IMAGE}
