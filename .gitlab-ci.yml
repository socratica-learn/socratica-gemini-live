stages:
  - lint
  - test
  - build
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_DRIVER: overlay2

# Cache configuration for dependencies
cache:
  paths:
    - backend/.m2/repository
    - frontend/node_modules/

####################
# Backend Pipeline #
####################

backend:lint:
  stage: lint
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - |
      if [ -f "pom.xml" ]; then
        mvn checkstyle:check
      else
        echo "No pom.xml found, skipping lint"
        exit 0
      fi
  allow_failure: true

backend:test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - |
      if [ -f "pom.xml" ]; then
        mvn test
        mvn jacoco:report
      else
        echo "No pom.xml found, skipping tests"
        exit 0
      fi
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
      coverage_report:
        coverage_format: cobertura
        path: backend/target/site/jacoco/jacoco.xml
    paths:
      - backend/target/
    expire_in: 1 week
    when: on_success
  allow_failure: true

backend:build:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  script:
    - cd backend
    - |
      if [ -f "pom.xml" ]; then
        mvn clean package -DskipTests
      else
        echo "No pom.xml found, skipping build"
        exit 0
      fi
  artifacts:
    paths:
      - backend/target/*.jar
    expire_in: 1 week
    when: on_success
  allow_failure: true

backend:docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  only:
    refs:
      - main
      - develop
      - backend
    changes:
      - backend/**/*
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd backend
    - docker build -t $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE/backend:latest .
    - docker push $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/backend:latest
  allow_failure: true
  when: manual

#####################
# Frontend Pipeline #
#####################

frontend:lint:
  stage: lint
  image: node:20
  script:
    - cd frontend
    - |
      if [ -f "package.json" ]; then
        npm ci
        npm run lint
      else
        echo "No package.json found, skipping lint"
        exit 0
      fi
  allow_failure: true

frontend:test:
  stage: test
  image: node:20
  script:
    - cd frontend
    - |
      if [ -f "package.json" ]; then
        npm ci
        npm run test:unit
      else
        echo "No package.json found, skipping tests"
        exit 0
      fi
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      junit:
        - frontend/test-results/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml
    paths:
      - frontend/coverage/
    expire_in: 1 week
    when: on_success
  allow_failure: true

frontend:build:
  stage: build
  image: node:20
  script:
    - cd frontend
    - |
      if [ -f "package.json" ]; then
        npm ci
        npm run build
      else
        echo "No package.json found, skipping build"
        exit 0
      fi
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week
    when: on_success
  allow_failure: true

frontend:docker:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  only:
    refs:
      - main
      - develop
      - frontend
    changes:
      - frontend/**/*
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - cd frontend
    - docker build -t $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA .
    - docker build -t $CI_REGISTRY_IMAGE/frontend:latest .
    - docker push $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  allow_failure: true
  when: manual

###################
# Deploy Stages   #
###################

deploy:development:
  stage: deploy
  image: alpine:latest
  only:
    refs:
      - develop
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "Deploying to development environment..."
    - echo "TODO Add deployment scripts"
  environment:
    name: development
    url: https://dev.socratica.app
  allow_failure: true

deploy:production:
  stage: deploy
  image: alpine:latest
  only:
    refs:
      - main
  before_script:
    - apk add --no-cache openssh-client
  script:
    - echo "Deploying to production environment..."
    - echo "TODO Add deployment scripts"
  environment:
    name: production
    url: https://socratica.app
  when: manual
  allow_failure: true
